
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-site:
    name: Build and validate site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Validate generated website
        run: |
          test -s _site/index.html
          test -s _site/assets/style.css
          test ! -e _site/Gemfile
          test ! -e _site/package.json

          echo "Website validation passed"

      # Allow inspecting PR builds without deploying them.
      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-website
          path: _site/
          if-no-files-found: error
          retention-days: 7

      # Prepare the production Pages deployment.
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    name: Deploy GitHub Pages
    needs: build-site
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages-production
      cancel-in-progress: false

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
